<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxoGT2P08O02nVmzJIcKqr-wFTK1sfGMB5vHjUIXiTbJIX1e37LC11pmHpwn1cYOohRSg/exec";


/* =====================================================
   ELEMENT
===================================================== */

const statusEl = document.getElementById("status");
const pertanyaanEl = document.getElementById("pertanyaan");
const jawabanEl = document.getElementById("jawaban");
const micBtn = document.getElementById("micBtn");
const helloBtn = document.getElementById("helloBtn");


/* =====================================================
   THREE.JS - INFORBOT V4 FINAL
===================================================== */

let scene=null;
let camera=null;
let renderer=null;
let robot=null;
let headGroup=null;
let headFoto=null;
let mataKiri=null;
let mataKanan=null;
let mulut=null;
let mulutBerbicara=false;
let sedangBerkedip=false;
let kedipTimer=null;
let waktuAnimasi=0;
let textureMataPejam=null;
let mataKedipKiri=null;
let mataKedipKanan=null;
/* =====================================================
   SISTEM WAJAH INFORBOT V8.2
===================================================== */

let teksturWajahNormalV8 = null;
let teksturMulutTerbukaV8 = null;

let mulutSedangBerbicaraV8 = false;
let mulutTerbukaV8 = false;
let waktuMulutV8 = 0;

let textureMataPejam = null;
let sedangBerkedip = false;
let kedipTimer = null;

function initThree(){
  scene=new THREE.Scene();
  scene.background=null;

  camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,100);
  camera.position.set(0,1.9,9.4);
  camera.lookAt(0,1.55,0);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;

  document.getElementById('robotCanvas').innerHTML='';
  document.getElementById('robotCanvas').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,1.35));
  const light=new THREE.PointLight(0x22aaff,2.5,20);
  light.position.set(0,4,5);
  scene.add(light);

  /* Parent tetap ada, tetapi BADAN/CHEST/LENGAN tidak dibuat. */
  robot=new THREE.Group();
  robot.position.y=-1.2;
  scene.add(robot);

  headGroup=new THREE.Group();
  headGroup.position.y=3.15;
  robot.add(headGroup);

  const headGeo=new THREE.BoxGeometry(2.05,1.6,1.48);
  const headMat=new THREE.MeshStandardMaterial({
    color:0x111b25,metalness:.72,roughness:.28,transparent:true,opacity:.16
  });
  headGroup.add(new THREE.Mesh(headGeo,headMat));

  muatWajahUtama();
  animate();
}

function muatWajahUtama(){
  const loader=new THREE.TextureLoader();
  loader.load('./INFORBOT_HEAD.png',function(texture){
    pasangTeksturWajah(texture);
    muatTeksturPejam();
    buatMulut();
    mulaiSistemKedip();
  },undefined,function(){
    console.warn('INFORBOT_HEAD.png tidak ditemukan; mencoba foto Apps Script.');
    ambilFotoRobot();
  });
}

function pasangTeksturWajah(texture){
  if(headFoto){ headGroup.remove(headFoto); headFoto=null; }
  texture.encoding=THREE.sRGBEncoding;
  const geo=new THREE.PlaneGeometry(2.35,1.78);
  const mat=new THREE.MeshBasicMaterial({map:texture,transparent:true,side:THREE.DoubleSide,depthTest:false,depthWrite:false});
  headFoto=new THREE.Mesh(geo,mat);
  /* =====================================================
   SIMPAN TEKSTUR WAJAH NORMAL
===================================================== */

teksturWajahNormalV8 = texture;
  headFoto.position.set(0,.05,.78);
  headFoto.renderOrder=10;
  headGroup.add(headFoto);
  /* =====================================================
   LOAD WAJAH MULUT TERBUKA
===================================================== */

const loaderMulutTerbuka =
  new THREE.TextureLoader();

loaderMulutTerbuka.load(
  "./INFORBOT_HEAD_TERBUKA.png",

  function(textureTerbuka){

    teksturMulutTerbukaV8 =
      textureTerbuka;

    console.log(
      "✅ INFORBOT_HEAD_TERBUKA.png BERHASIL DIMUAT"
    );

  },

  undefined,

  function(error){

    console.error(
      "❌ GAGAL MEMUAT INFORBOT_HEAD_TERBUKA.png",
      error
    );

  }
);
  console.log('INFORBOT_HEAD.png berhasil dipasang.');
}


/* =====================================================
   LOAD TEKSTUR MATA TERPEJAM
===================================================== */

const loaderPejam =
  new THREE.TextureLoader();

loaderPejam.load(

  "./INFORBOT_HEAD_PEJAM.png",

  function(texturePejam){

    textureMataPejam =
      texturePejam;

    console.log(
      "👁️ INFORBOT_HEAD_PEJAM.png BERHASIL DIMUAT"
    );

    /* MULAI SISTEM KEDIP */
    mulaiKedipan();

  },

  undefined,

  function(error){

    console.warn(
      "⚠️ INFORBOT_HEAD_PEJAM.png TIDAK DITEMUKAN",
      error
    );

  }

);

/* =====================================================
   INFORBOT V8.2
   ANIMASI MULUT BERDASARKAN TEKSTUR
===================================================== */

function animasiMulut(){

  if(!headFoto){
    return;
  }

  if(!headFoto.material){
    return;
  }

  /*
     Kalau sedang berkedip,
     jangan ganggu tekstur mata.
  */

  if(sedangBerkedip){
    return;
  }

  /*
     Pastikan kedua tekstur sudah tersedia.
  */

  if(!teksturWajahNormalV8){
    return;
  }

  if(!teksturMulutTerbukaV8){
    return;
  }


  /* =================================================
     TIDAK BERBICARA
  ================================================= */

  if(!mulutSedangBerbicaraV8){

    if(
      headFoto.material.map !==
      teksturWajahNormalV8
    ){

      headFoto.material.map =
        teksturWajahNormalV8;

      headFoto.material.needsUpdate =
        true;
    }

    mulutTerbukaV8 = false;

    return;
  }


  /* =================================================
     SEDANG BERBICARA
  ================================================= */

  waktuMulutV8 += 0.016;


  /*
     Kecepatan buka-tutup mulut
  */

  if(waktuMulutV8 >= 0.16){

    waktuMulutV8 = 0;

    mulutTerbukaV8 =
      !mulutTerbukaV8;


    if(mulutTerbukaV8){

      headFoto.material.map =
        teksturMulutTerbukaV8;

      console.log(
        "👄 MULUT TERBUKA"
      );

    }
    else{

      headFoto.material.map =
        teksturWajahNormalV8;

      console.log(
        "👄 MULUT TERTUTUP"
      );

    }

    headFoto.material.needsUpdate =
      true;
  }

}

/* =====================================================
   MULAI BERBICARA
===================================================== */

function mulaiMulutBerbicara(){

  mulutSedangBerbicaraV8 =
    true;

  waktuMulutV8 = 0;

  console.log(
    "🔊 INFORBOT MULAI BERBICARA"
  );

}

function testMulutV82(){

  console.log(
    "🧪 TEST MULUT V8.2"
  );

  mulaiMulutBerbicara();

  setTimeout(function(){

    berhentiMulutBerbicara();

  },5000);

}

/* =====================================================
   BERHENTI BERBICARA
===================================================== */

function berhentiMulutBerbicara(){

  mulutSedangBerbicaraV8 =
    false;

  mulutTerbukaV8 =
    false;

  waktuMulutV8 =
    0;

  if(
    headFoto &&
    headFoto.material &&
    teksturWajahNormalV8
  ){

    headFoto.material.map =
      teksturWajahNormalV8;

    headFoto.material.needsUpdate =
      true;
  }

  console.log(
    "🔇 INFORBOT BERHENTI BERBICARA"
  );

}


/* =====================================================
   ANIMASI MULUT V7
===================================================== */

function animasiMulut(){

  if(!mulut){
    return;
  }


  /* =================================================
     MULUT DIAM
  ================================================= */

  if(!mulutBerbicara){

    mulut.scale.y +=
      (0.08 - mulut.scale.y) * 0.30;

    return;
  }


  /* =================================================
     GERAKAN MULUT SAAT BERBICARA
  ================================================= */

  const waktu =
    performance.now() * 0.015;


  /*
     GERAKAN UTAMA
  */

  const gelombang1 =
    Math.abs(
      Math.sin(waktu)
    );


  /*
     GERAKAN KEDUA
     Membuat pola lebih alami.
  */

  const gelombang2 =
    Math.abs(
      Math.sin(waktu * 1.67)
    );


  /*
     CAMPURAN GERAKAN
  */

  const gerakan =
    (gelombang1 * 0.70) +
    (gelombang2 * 0.30);


  /* =================================================
     TINGGI BUKAAN
  ================================================= */

  const targetY =
    0.08 +
    gerakan * 0.62;


  /*
     LEBAR MULUT JUGA SEDIKIT BERUBAH

     Ketika membuka:
     sedikit lebih lebar.
  */

  const targetX =
    1.25 +
    gerakan * 0.18;


  /* =================================================
     ANIMASI HALUS
  ================================================= */

  mulut.scale.y +=
    (targetY - mulut.scale.y) * 0.50;


  mulut.scale.x +=
    (targetX - mulut.scale.x) * 0.35;

}
function mulaiKedipan(){
  if(kedipTimer)clearTimeout(kedipTimer);
  kedipTimer=setTimeout(function(){kedipMata();mulaiKedipan();},2500+Math.random()*3500);
}

/* =====================================================
   KEDIP MATA
===================================================== */

function kedipMata(){

  if(
    sedangBerkedip ||
    !headFoto ||
    !textureMataPejam
  ){

    return;
  }

  sedangBerkedip = true;

  const teksturSebelumnya =
    headFoto.material.map;


  /* MATA TERPEJAM */

  headFoto.material.map =
    textureMataPejam;

  headFoto.material.needsUpdate =
    true;


  setTimeout(function(){

    if(
      headFoto &&
      headFoto.material
    ){

      /*
         Kembalikan tekstur sebelumnya.
         Kalau sedang berbicara,
         akan kembali ke kondisi mulut
         yang sedang aktif.
      */

      if(
        mulutSedangBerbicaraV8 &&
        mulutTerbukaV8 &&
        teksturMulutTerbukaV8
      ){

        headFoto.material.map =
          teksturMulutTerbukaV8;

      }
      else{

        headFoto.material.map =
          teksturWajahNormalV8;

      }

      headFoto.material.needsUpdate =
        true;

    }

    sedangBerkedip = false;

  },180);

}

  buatMataKedipSementara();
  setTimeout(function(){hapusMataKedipSementara();sedangBerkedip=false;},150);
}

function buatMataKedipSementara(){
  if(!headGroup)return;
  const geo=new THREE.PlaneGeometry(.34,.045);
  const mat=new THREE.MeshBasicMaterial({color:0x07111c,transparent:true,opacity:.95,depthTest:false,depthWrite:false});
  mataKedipKiri=new THREE.Mesh(geo,mat);
  mataKedipKanan=new THREE.Mesh(geo,mat);
  mataKedipKiri.position.set(-.42,.18,.875);
  mataKedipKanan.position.set(.42,.18,.875);
  mataKedipKiri.renderOrder=120;
  mataKedipKanan.renderOrder=120;
  headGroup.add(mataKedipKiri, mataKedipKanan);
}

function hapusMataKedipSementara(){
  if(mataKedipKiri){headGroup.remove(mataKedipKiri);mataKedipKiri=null;}
  if(mataKedipKanan){headGroup.remove(mataKedipKanan);mataKedipKanan=null;}
}

/* =====================================================
   JADWAL KEDIP
===================================================== */

function mulaiKedipan(){

  if(kedipTimer){

    clearTimeout(kedipTimer);

  }

  kedipTimer =
    setTimeout(function(){

      kedipMata();

      mulaiKedipan();

    },2500 + Math.random() * 3500);

}

/* SATU-SATUNYA animate() */
function animate(){
  requestAnimationFrame(animate);
  waktuAnimasi+=.016;

  if(robot){
    robot.rotation.y=Math.sin(waktuAnimasi*.5)*.035;
    robot.position.y=-1.2+Math.sin(waktuAnimasi*1.2)*.025;
  }

  if(headGroup){
    headGroup.rotation.y=Math.sin(waktuAnimasi*.65)*.045;
    headGroup.rotation.x=Math.sin(waktuAnimasi*.45)*.018;
  }

  animasiMulut();
  renderer.render(scene,camera);
}

/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(!camera || !renderer) return;

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =====================================================
   ROBOT BICARA
===================================================== */

function bicara(teks){

  teks = String(teks || "");

  if(!teks){
    return;
  }

  window.speechSynthesis.cancel();

  const suara =
    new SpeechSynthesisUtterance(teks);

  suara.lang = "id-ID";
  suara.rate = .95;
  suara.pitch = 1;

  suara.onstart = function(){

    statusEl.innerText =
      "🔊 INFORBOT SEDANG BERBICARA";

  };

  suara.onend = function(){

    statusEl.innerText =
      "SIAP MEMBANTU";

  };

  window.speechSynthesis.speak(suara);
}


/* =====================================================
   SAPA ROBOT
===================================================== */

helloBtn.addEventListener(
  "click",
  function(){

    const teks =
      "Halo! Saya INFORBOT AI. Saya siap membantu kamu belajar Informatika, kecerdasan buatan, dan teknologi.";

    pertanyaanEl.innerText =
      "Pertanyaan: Sapaan";

    jawabanEl.innerText = teks;

    bicara(teks);

  }
);


/* =====================================================
   KIRIM PERTANYAAN KE APPS SCRIPT
   MENGGUNAKAN JSONP
===================================================== */

function kirimPertanyaan(teks, selesai){

  const script =
    document.createElement("script");

  const callbackName =
    "inforbotCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*10000);


  let sudahSelesai = false;


  function bersihkan(){

    if(sudahSelesai) return;

    sudahSelesai = true;

    if(window[callbackName]){
      delete window[callbackName];
    }

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data){

      let jawaban =
        "Maaf, INFORBOT belum mendapatkan jawaban dari server.";

      if(
        data &&
        data.success &&
        data.jawaban
      ){

        jawaban =
          String(data.jawaban);

      }

      selesai(jawaban);

      bersihkan();

    };


  script.onerror =
    function(){

      selesai(
        "Koneksi ke otak INFORBOT belum berhasil. Periksa deployment Apps Script V3.0."
      );

      bersihkan();

    };


  const url =
    APPS_SCRIPT_URL +
    "?action=ask" +
    "&q=" +
    encodeURIComponent(teks) +
    "&callback=" +
    callbackName;


  script.src = url;

  document.body.appendChild(script);

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

let recognition = null;
let sedangMendengar = false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang = "id-ID";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.onstart =
    function(){

      sedangMendengar = true;

      micBtn.innerText =
        "⏹ Berhenti";

      statusEl.innerText =
        "🎤 SAYA SEDANG MENDENGARKAN...";

    };


  recognition.onresult =
    function(event){

      const teks =
        event.results[0][0].transcript.trim();


      if(!teks) return;


      pertanyaanEl.innerText =
        "Pertanyaan: " + teks;

      jawabanEl.innerText =
        "⏳ INFORBOT sedang berpikir...";

      statusEl.innerText =
        "🧠 INFORBOT SEDANG BERPIKIR";


      kirimPertanyaan(
        teks,
        function(jawaban){

          jawabanEl.innerText =
            jawaban;

          bicara(jawaban);

        }
      );

    };


  recognition.onerror =
    function(event){

      console.log(
        "Speech error:",
        event.error
      );


      if(event.error === "not-allowed"){

        jawabanEl.innerText =
          "Izin mikrofon ditolak. Silakan izinkan mikrofon pada browser.";

      }
      else if(event.error === "no-speech"){

        jawabanEl.innerText =
          "Saya belum mendengar suara. Silakan coba lagi.";

      }
      else{

        jawabanEl.innerText =
          "Terjadi masalah pada mikrofon: " +
          event.error;

      }

      statusEl.innerText =
        "SIAP MEMBANTU";

    };


  recognition.onend =
    function(){

      sedangMendengar = false;

      micBtn.innerText =
        "🎤 Mulai Bicara";

      if(
        statusEl.innerText ===
        "🎤 SAYA SEDANG MENDENGARKAN..."
      ){

        statusEl.innerText =
          "SIAP MEMBANTU";

      }

    };


}
else{

  micBtn.disabled = true;

  statusEl.innerText =
    "Browser tidak mendukung Speech Recognition";

}


/* =====================================================
   TOMBOL MIKROFON
===================================================== */

micBtn.addEventListener(
  "click",
  function(){

    if(!recognition){

      alert(
        "Browser ini belum mendukung pengenalan suara."
      );

      return;

    }


    if(sedangMendengar){

      recognition.stop();

    }
    else{

      try{

        window.speechSynthesis.cancel();

        recognition.start();

      }
      catch(error){

        console.log(error);

      }

    }

  }
);

/* =====================================================
   FALLBACK FOTO DARI APPS SCRIPT
===================================================== */

function ambilFotoRobot(){
  const script=document.createElement('script');
  const callbackName='fotoRobotCallback_'+Date.now();

  window[callbackName]=function(data){
    if(data&&data.success&&data.data){
      const loader=new THREE.TextureLoader();
      loader.load(data.data,function(texture){
        pasangTeksturWajah(texture);
        muatTeksturPejam();
        buatMulut();
        mulaiSistemKedip();
      });
    }else{
      console.warn('Foto fallback tidak tersedia.');
    }
    delete window[callbackName];
    if(script.parentNode)script.parentNode.removeChild(script);
  };

  script.onerror=function(){
    console.warn('Gagal mengambil foto fallback.');
    delete window[callbackName];
    if(script.parentNode)script.parentNode.removeChild(script);
  };

  script.src=APPS_SCRIPT_URL+'?action=foto&callback='+callbackName;
  document.body.appendChild(script);
}
