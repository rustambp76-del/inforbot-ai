<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INFORBOT AI V3.0</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020711;
  color:white;
}

#app{
  position:relative;
  width:100%;
  height:100%;
}

#robotCanvas{
  position:absolute;
  inset:0;
  z-index:1;
}

#judul{
  position:absolute;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  text-align:center;
}

#judul h1{
  margin:0;
  font-size:30px;
  color:#66ddff;
  text-shadow:0 0 15px #008cff;
}

#judul p{
  margin:5px 0 0;
  font-size:13px;
  color:#bdefff;
}

#akun{
  position:absolute;
  top:15px;
  right:18px;
  z-index:20;
  color:#66ddff;
  font-size:13px;
  font-weight:bold;
}

#panel{
  position:absolute;
  left:50%;
  bottom:55px;
  transform:translateX(-50%);
  width:min(700px,92%);
  z-index:20;
  padding:18px;
  border:1px solid #168cff;
  border-radius:18px;
  background:rgba(0,10,25,.82);
  box-shadow:0 0 25px rgba(0,150,255,.35);
  backdrop-filter:blur(8px);
}

#status{
  text-align:center;
  color:#66ddff;
  font-weight:bold;
  margin-bottom:10px;
}

#pertanyaan{
  min-height:30px;
  color:#ddd;
  font-size:14px;
  margin-bottom:8px;
}

#jawaban{
  min-height:45px;
  color:#fff;
  line-height:1.5;
  font-size:15px;
}

#tombol{
  display:flex;
  justify-content:center;
  gap:10px;
  margin-top:14px;
  flex-wrap:wrap;
}

button{
  border:none;
  border-radius:12px;
  padding:11px 18px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  color:white;
  background:#075b91;
  box-shadow:0 0 12px rgba(0,150,255,.35);
}

button:hover{
  background:#087abf;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

#micBtn{
  background:#006d52;
}

#helloBtn{
  background:#51429a;
}

#copyrightTop{
  position:absolute;
  left:18px;
  top:15px;
  z-index:20;
  color:#66ddff;
  font-size:12px;
}

#copyrightBottom{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:20;
  color:#66ddff;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;
  text-shadow:0 0 8px #00aaff;
}

@media(max-width:600px){
  #judul h1{
    font-size:23px;
  }

  #judul p{
    font-size:11px;
  }

  #panel{
    bottom:42px;
    padding:12px;
  }

  button{
    padding:10px 14px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div id="robotCanvas"></div>

  <div id="copyrightTop">
    © Rustam, SE
  </div>

  <div id="akun">
    Guru_Hebat
  </div>

  <div id="judul">
    <h1>🤖 INFORBOT AI</h1>
    <p>Asisten Cerdas Informatika • AI • Teknologi</p>
  </div>

  <div id="panel">

    <div id="status">
      SIAP MEMBANTU
    </div>

    <div id="pertanyaan">
      Pertanyaan: -
    </div>

    <div id="jawaban">
      Halo! Saya INFORBOT AI. Silakan tekan tombol mikrofon dan ajukan pertanyaan.
    </div>

    <div id="tombol">

      <button id="helloBtn">
        👋 Sapa Robot
      </button>

      <button id="micBtn">
        🎤 Mulai Bicara
      </button>

    </div>

  </div>

  <div id="copyrightBottom">
    HAK CIPTA RUSTAM, S.E.
  </div>

</div>

<script>

/* =====================================================
   KONFIGURASI
===================================================== */

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxoGT2P08O02nVmzJIcKqr-wFTK1sfGMB5vHjUIXiTbJIX1e37LC11pmHpwn1cYOohRSg/exec";


/* =====================================================
   ELEMENT
===================================================== */

const statusEl = document.getElementById("status");
const pertanyaanEl = document.getElementById("pertanyaan");
const jawabanEl = document.getElementById("jawaban");
const micBtn = document.getElementById("micBtn");
const helloBtn = document.getElementById("helloBtn");


/* =====================================================
   THREE.JS
===================================================== */

let scene;
let camera;
let renderer;
let robot;

let mataKiri;
let mataKanan;
let mulut;

let robotIdle = true;


function initThree(){

  scene = new THREE.Scene();

  scene.background = new THREE.Color(0x020711);

  camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );

  camera.position.set(0,1.8,9);
  camera.lookAt(0,1.5,0);

  renderer = new THREE.WebGLRenderer({
    antialias:true
  });

  renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
  );

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  document
    .getElementById("robotCanvas")
    .appendChild(renderer.domElement);


  /* LIGHT */

  const ambient = new THREE.AmbientLight(
    0xffffff,
    1.3
  );

  scene.add(ambient);


  const light = new THREE.PointLight(
    0x22aaff,
    2.5,
    20
  );

  light.position.set(0,4,5);

  scene.add(light);


  /* ROBOT */

  robot = new THREE.Group();

  robot.position.y = -1.2;

  scene.add(robot);


  const bodyMat = new THREE.MeshStandardMaterial({
    color:0xe8f2f5,
    metalness:.7,
    roughness:.25
  });

  const darkMat = new THREE.MeshStandardMaterial({
    color:0x101820,
    metalness:.8,
    roughness:.2
  });

  const blueMat = new THREE.MeshStandardMaterial({
    color:0x0099ff,
    emissive:0x0066aa,
    emissiveIntensity:1.5
  });


  /* BODY */

  const bodyGeo =
    new THREE.BoxGeometry(2.2,2.4,1.3);

  const body =
    new THREE.Mesh(bodyGeo,bodyMat);

  body.position.y = 1.35;

  robot.add(body);


  /* CHEST */

  const chestGeo =
    new THREE.BoxGeometry(.8,.45,.08);

  const chest =
    new THREE.Mesh(chestGeo,blueMat);

  chest.position.set(0,1.45,.68);

  robot.add(chest);


  /* HEAD */

  const headGroup = new THREE.Group();

  headGroup.position.y = 3.15;

  robot.add(headGroup);


  const headGeo =
    new THREE.BoxGeometry(2.0,1.55,1.45);

  const head =
    new THREE.Mesh(headGeo,bodyMat);

  headGroup.add(head);


  /* FACE */

  const faceGeo =
    new THREE.BoxGeometry(1.55,.9,.08);

  const faceMat =
    new THREE.MeshStandardMaterial({
      color:0x07111c,
      metalness:.5,
      roughness:.2
    });

  const face =
    new THREE.Mesh(faceGeo,faceMat);

  face.position.z = .75;

  headGroup.add(face);


  /* MATA */

  const eyeGeo =
    new THREE.BoxGeometry(.38,.16,.06);

  mataKiri =
    new THREE.Mesh(eyeGeo,blueMat);

  mataKanan =
    new THREE.Mesh(eyeGeo,blueMat);

  mataKiri.position.set(-.42,.18,.81);
  mataKanan.position.set(.42,.18,.81);

  headGroup.add(mataKiri);
  headGroup.add(mataKanan);


  /* MULUT */

  const mouthGeo =
    new THREE.BoxGeometry(.7,.12,.06);

  mulut =
    new THREE.Mesh(mouthGeo,blueMat);

  mulut.position.set(0,-.25,.82);

  headGroup.add(mulut);


  /* LEHER */

  const neckGeo =
    new THREE.CylinderGeometry(.35,.35,.35,32);

  const neck =
    new THREE.Mesh(neckGeo,darkMat);

  neck.position.y = 2.45;

  robot.add(neck);


  /* LENGAN */

  buatLengan(-1);
  buatLengan(1);


  animate();
}


function buatLengan(sisi){

  const armGroup = new THREE.Group();

  armGroup.position.set(
    sisi * 1.45,
    1.45,
    0
  );

  robot.add(armGroup);


  const upperGeo =
    new THREE.BoxGeometry(.45,1.45,.55);

  const armMat =
    new THREE.MeshStandardMaterial({
      color:0xcbd8dc,
      metalness:.7,
      roughness:.3
    });

  const upper =
    new THREE.Mesh(upperGeo,armMat);

  armGroup.add(upper);


  const handGeo =
    new THREE.SphereGeometry(.32,20,20);

  const hand =
    new THREE.Mesh(handGeo,armMat);

  hand.position.y = -.9;

  armGroup.add(hand);

}


function animate(){

  requestAnimationFrame(animate);

  if(robot){

    robot.rotation.y =
      Math.sin(Date.now()*0.0005)*0.05;

    robot.position.y =
      -1.2 +
      Math.sin(Date.now()*0.0015)*0.03;

  }

  renderer.render(scene,camera);
}


/* =====================================================
   RESIZE
===================================================== */

window.addEventListener(
  "resize",
  function(){

    if(!camera || !renderer) return;

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =====================================================
   ROBOT BICARA
===================================================== */

function bicara(teks){

  teks = String(teks || "");

  if(!teks){
    return;
  }

  window.speechSynthesis.cancel();

  const suara =
    new SpeechSynthesisUtterance(teks);

  suara.lang = "id-ID";
  suara.rate = .95;
  suara.pitch = 1;

  suara.onstart = function(){

    statusEl.innerText =
      "🔊 INFORBOT SEDANG BERBICARA";

  };

  suara.onend = function(){

    statusEl.innerText =
      "SIAP MEMBANTU";

  };

  window.speechSynthesis.speak(suara);
}


/* =====================================================
   SAPA ROBOT
===================================================== */

helloBtn.addEventListener(
  "click",
  function(){

    const teks =
      "Halo! Saya INFORBOT AI. Saya siap membantu kamu belajar Informatika, kecerdasan buatan, dan teknologi.";

    pertanyaanEl.innerText =
      "Pertanyaan: Sapaan";

    jawabanEl.innerText = teks;

    bicara(teks);

  }
);


/* =====================================================
   KIRIM PERTANYAAN KE APPS SCRIPT
   MENGGUNAKAN JSONP
===================================================== */

function kirimPertanyaan(teks, selesai){

  const script =
    document.createElement("script");

  const callbackName =
    "inforbotCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*10000);


  let sudahSelesai = false;


  function bersihkan(){

    if(sudahSelesai) return;

    sudahSelesai = true;

    if(window[callbackName]){
      delete window[callbackName];
    }

    if(script.parentNode){
      script.parentNode.removeChild(script);
    }

  }


  window[callbackName] =
    function(data){

      let jawaban =
        "Maaf, INFORBOT belum mendapatkan jawaban dari server.";

      if(
        data &&
        data.success &&
        data.jawaban
      ){

        jawaban =
          String(data.jawaban);

      }

      selesai(jawaban);

      bersihkan();

    };


  script.onerror =
    function(){

      selesai(
        "Koneksi ke otak INFORBOT belum berhasil. Periksa deployment Apps Script V3.0."
      );

      bersihkan();

    };


  const url =
    APPS_SCRIPT_URL +
    "?action=ask" +
    "&q=" +
    encodeURIComponent(teks) +
    "&callback=" +
    callbackName;


  script.src = url;

  document.body.appendChild(script);

}


/* =====================================================
   SPEECH RECOGNITION
===================================================== */

let recognition = null;
let sedangMendengar = false;


const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition =
    new SpeechRecognition();

  recognition.lang = "id-ID";

  recognition.continuous = false;

  recognition.interimResults = false;

  recognition.maxAlternatives = 1;


  recognition.onstart =
    function(){

      sedangMendengar = true;

      micBtn.innerText =
        "⏹ Berhenti";

      statusEl.innerText =
        "🎤 SAYA SEDANG MENDENGARKAN...";

    };


  recognition.onresult =
    function(event){

      const teks =
        event.results[0][0].transcript.trim();


      if(!teks) return;


      pertanyaanEl.innerText =
        "Pertanyaan: " + teks;

      jawabanEl.innerText =
        "⏳ INFORBOT sedang berpikir...";

      statusEl.innerText =
        "🧠 INFORBOT SEDANG BERPIKIR";


      kirimPertanyaan(
        teks,
        function(jawaban){

          jawabanEl.innerText =
            jawaban;

          bicara(jawaban);

        }
      );

    };


  recognition.onerror =
    function(event){

      console.log(
        "Speech error:",
        event.error
      );


      if(event.error === "not-allowed"){

        jawabanEl.innerText =
          "Izin mikrofon ditolak. Silakan izinkan mikrofon pada browser.";

      }
      else if(event.error === "no-speech"){

        jawabanEl.innerText =
          "Saya belum mendengar suara. Silakan coba lagi.";

      }
      else{

        jawabanEl.innerText =
          "Terjadi masalah pada mikrofon: " +
          event.error;

      }

      statusEl.innerText =
        "SIAP MEMBANTU";

    };


  recognition.onend =
    function(){

      sedangMendengar = false;

      micBtn.innerText =
        "🎤 Mulai Bicara";

      if(
        statusEl.innerText ===
        "🎤 SAYA SEDANG MENDENGARKAN..."
      ){

        statusEl.innerText =
          "SIAP MEMBANTU";

      }

    };


}
else{

  micBtn.disabled = true;

  statusEl.innerText =
    "Browser tidak mendukung Speech Recognition";

}


/* =====================================================
   TOMBOL MIKROFON
===================================================== */

micBtn.addEventListener(
  "click",
  function(){

    if(!recognition){

      alert(
        "Browser ini belum mendukung pengenalan suara."
      );

      return;

    }


    if(sedangMendengar){

      recognition.stop();

    }
    else{

      try{

        window.speechSynthesis.cancel();

        recognition.start();

      }
      catch(error){

        console.log(error);

      }

    }

  }
);

/* =====================================================
   FOTO ROBOT DARI GOOGLE DRIVE
===================================================== */

let fotoRobot = null;

function ambilFotoRobot() {

  const script = document.createElement("script");

  const callbackName =
    "fotoRobotCallback_" + Date.now();

  window[callbackName] = function(data) {

    if (data && data.success && data.data) {

      console.log("Foto robot berhasil:", data.nama);

      fotoRobot = data.data;

      pasangFotoKeRobot(fotoRobot);
    }

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };

  script.onerror = function() {

    console.log("Foto robot gagal diambil.");

    delete window[callbackName];

    if (script.parentNode) {
      script.parentNode.removeChild(script);
    }
  };

  script.src =
    APPS_SCRIPT_URL +
    "?action=foto" +
    "&callback=" +
    callbackName;

  document.body.appendChild(script);
}


/* =====================================================
   MENYIAPKAN FOTO WAJAH ROBOT
===================================================== */

function pasangFotoKeRobot(dataFoto) {

  const textureLoader =
    new THREE.TextureLoader();

  textureLoader.load(
    dataFoto,

    function(texture) {

      texture.encoding =
        THREE.sRGBEncoding;

      /* =====================================
         PANEL WAJAH FOTO
      ===================================== */

      const fotoGeo =
        new THREE.PlaneGeometry(1.45, 0.85);

      const fotoMat =
        new THREE.MeshBasicMaterial({
          map: texture,
          transparent: true
        });

      const fotoWajah =
        new THREE.Mesh(
          fotoGeo,
          fotoMat
        );

      /*
       * Posisi depan kepala robot
       */
      fotoWajah.position.set(
        0,
        3.15,
        1.49
      );

      /*
       * Sedikit dikecilkan agar
       * tetap berada di dalam kepala.
       */
      fotoWajah.scale.set(
        0.85,
        0.85,
        0.85
      );

      /*
       * Robot adalah Group utama
       */
      robot.add(fotoWajah);

      console.log(
        "Foto wajah berhasil dipasang ke robot."
      );

    },

    undefined,

    function(error) {

      console.log(
        "Gagal memasang foto wajah:",
        error
      );

    }
  );
}

/* =====================================================
   MULAI
===================================================== */

initThree();

setTimeout(function() {
  ambilFotoRobot();
}, 1000);



</script>

</body>
</html>
