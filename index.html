<script>

/* =====================================================
   KONFIGURASI
===================================================== */
const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbxoGT2P08O02nVmzJIcKqr-wFTK1sfGMB5vHjUIXiTbJIX1e37LC11pmHpwn1cYOohRSg/exec";

/* =====================================================
   ELEMENT
===================================================== */
const statusEl = document.getElementById("status");
const pertanyaanEl = document.getElementById("pertanyaan");
const jawabanEl = document.getElementById("jawaban");
const micBtn = document.getElementById("micBtn");
const helloBtn = document.getElementById("helloBtn");

/* =====================================================
   INFORBOT V9.1
   SISTEM MULUT TANPA GHOSTING
===================================================== */
/* =====================================================
   THREE.JS
===================================================== */
let scene = null;
let camera = null;
let renderer = null;

let robot = null;
let headGroup = null;
let headFoto = null;
let waktuAnimasi = 0;

/* =====================================================
   TEKSTUR WAJAH V9.1
===================================================== */
let teksturWajahNormalV91 = null;
let teksturMulutTerbukaV91 = null;

/* =====================================================
   ANIMASI MULUT V9.1
===================================================== */

let mulutSedangBerbicaraV91 = false;
let mulutTerbukaV91 = false;

let waktuMulutV91 = 0;
let durasiMulutV91 = 0;

let faseMulutV91 = 0;
/* =====================================================
   INFORBOT AI V10 - MATA LAYER
===================================================== */
let mataLayerV10 = null;
let mataPejamV10 = null;

let sedangBerkedipV10 = false;
let timerKedipV10 = null;

function initThree(){
  scene=new THREE.Scene();
  scene.background=null;

  camera=new THREE.PerspectiveCamera(45,window.innerWidth/window.innerHeight,.1,100);
  camera.position.set(0,1.9,9.4);
  camera.lookAt(0,1.55,0);

  renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setSize(window.innerWidth,window.innerHeight);
  renderer.outputEncoding=THREE.sRGBEncoding;

  document.getElementById('robotCanvas').innerHTML='';
  document.getElementById('robotCanvas').appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xffffff,1.35));
  const light=new THREE.PointLight(0x22aaff,2.5,20);
  light.position.set(0,4,5);
  scene.add(light);

  /* Parent tetap ada, tetapi BADAN/CHEST/LENGAN tidak dibuat. */
  robot=new THREE.Group();
  robot.position.y=-1.2;
  scene.add(robot);

  headGroup=new THREE.Group();
  headGroup.position.y=3.15;
  robot.add(headGroup);

  const headGeo=new THREE.BoxGeometry(2.05,1.6,1.48);
  const headMat=new THREE.MeshStandardMaterial({
    color:0x111b25,metalness:.72,roughness:.28,transparent:true,opacity:.16
  });
  headGroup.add(new THREE.Mesh(headGeo,headMat));
  pasangWajahV91();
  buatKelopakNaturalV11();
  mulaiKedipanV10();
  animate();
}

/* =====================================================
   INFORBOT V9.1
   LOAD WAJAH
===================================================== */
function pasangWajahV91(){
  const loader =
    new THREE.TextureLoader();
  /* =================================================
     WAJAH NORMAL
  ================================================= */
  loader.load(

    "./INFORBOT_HEAD.png",
    function(texture){
      teksturWajahNormalV91 =
        texture;
      teksturWajahNormalV91.encoding =
        THREE.sRGBEncoding;
      const geo =
        new THREE.PlaneGeometry(
          2.35,
          1.78
        );
      const mat =
        new THREE.MeshBasicMaterial({
          map:
            teksturWajahNormalV91,
          transparent:true,
          opacity:1,
          side:
            THREE.DoubleSide,
          depthTest:false,
          depthWrite:false
        });
      headFoto =
        new THREE.Mesh(
          geo,
          mat
        );
      headFoto.position.set(
        0,
        0.05,
        0.78
      );
      headFoto.renderOrder =
        10;
      headGroup.add(
        headFoto
      );
      console.log(
        "✅ V9.1 WAJAH NORMAL SIAP"
      );
       /* =============================================
         LOAD MULUT TERBUKA
      ============================================= */
      loader.load(
        "./INFORBOT_HEAD_TERBUKA.png",
        function(texture){
          teksturMulutTerbukaV91 =
            texture;
          teksturMulutTerbukaV91.encoding =
            THREE.sRGBEncoding;
          console.log(
            "👄 V9.1 TEKSTUR MULUT TERBUKA SIAP"
          );
        },
        undefined,
        function(error){
          console.error(
            "❌ GAGAL MEMUAT INFORBOT_HEAD_TERBUKA.png",
            error
          );
        }
      );
    },
    undefined,
    function(error){
      console.error(
        "❌ GAGAL MEMUAT INFORBOT_HEAD.png",
        error
      );
    }
  );
}    

/* =====================================================
   MULUT MULAI BERBICARA V9.1
===================================================== */
function mulaiMulutBerbicara(){
  mulutSedangBerbicaraV91 =
    true;
  waktuMulutV91 =
    0;
  durasiMulutV91 =
    0.08;
  faseMulutV91 =
    Math.random();
  console.log(
    "🔊 V9.1 MULUT MULAI BERBICARA"
  );
}

/* =====================================================
   MULUT BERHENTI BERBICARA V9.1
===================================================== */
function berhentiMulutBerbicara(){
  mulutSedangBerbicaraV91 =
    false;
  mulutTerbukaV91 =
    false;
  waktuMulutV91 =
    0;
  if(
    headFoto &&
    teksturWajahNormalV91
  ){
    headFoto.material.map =
      teksturWajahNormalV91;
    headFoto.material.needsUpdate =
      true;
  }
  console.log(
    "🔇 V9.2 MULUT BERHENTI"
  );
}
/* =====================================================
   INFORBOT V9.2
   ANIMASI MULUT LEBIH NATURAL
===================================================== */
function animasiMulut(){
  if(
    !headFoto ||
    !teksturWajahNormalV91 ||
    !teksturMulutTerbukaV91
  ){
    return;
  }

  /* =================================================
     TIDAK BERBICARA
  ================================================= */
  if(!mulutSedangBerbicaraV91){
    if(
      headFoto.material.map !==
      teksturWajahNormalV91
    ){
      headFoto.material.map =
        teksturWajahNormalV91;
      headFoto.material.needsUpdate =
        true;
    }
    mulutTerbukaV91 = false;
    waktuMulutV91 = 0;
    return;
  }

  /* =================================================
     HITUNG WAKTU
  ================================================= */
  waktuMulutV91 += 0.016;

  /* =================================================
     GANTI GERAKAN
  ================================================= */
  if(
    waktuMulutV91 >=
    durasiMulutV91
  ){
    waktuMulutV91 = 0;

    /* =============================================
       MULUT SEDANG TERTUTUP
       → BUKA
    ============================================= */
    if(!mulutTerbukaV91){
      mulutTerbukaV91 = true;
      headFoto.material.map =
        teksturMulutTerbukaV91;
      headFoto.material.needsUpdate =
        true;
      /*
         Mulut terbuka lebih lama.
         Variasi supaya tidak monoton.
      */
      const r =
        Math.random();
      if(r < 0.30){
        durasiMulutV91 =
          0.18;
      }
      else if(r < 0.75){
        durasiMulutV91 =
          0.24;
      }
      else{
        durasiMulutV91 =
          0.30;
      }
      console.log(
        "👄 V9.2 BUKA"
      );
    }

    /* =============================================
       MULUT TERBUKA
       → TUTUP
    ============================================= */
    else{
      mulutTerbukaV91 = false;
      headFoto.material.map =
        teksturWajahNormalV91;
      headFoto.material.needsUpdate =
        true;

      /*
         Jeda tertutup dibuat sedikit
         lebih pendek daripada bukaan.
      */

      const r =
        Math.random();
      if(r < 0.25){
        durasiMulutV91 =
          0.10;
      }
      else if(r < 0.75){
        durasiMulutV91 =
          0.14;
      }
      else{
        durasiMulutV91 =
          0.20;
      }
      console.log(
        "👄 V9.2 TUTUP"
      );
    }
  }
}
function buatMataKedipSementara(){
  if(!headGroup)return;
  const geo=new THREE.PlaneGeometry(.34,.045);
  const mat=new THREE.MeshBasicMaterial({color:0x07111c,transparent:true,opacity:.95,depthTest:false,depthWrite:false});
  mataKedipKiri=new THREE.Mesh(geo,mat);
  mataKedipKanan=new THREE.Mesh(geo,mat);
  mataKedipKiri.position.set(-.42,.18,.875);
  mataKedipKanan.position.set(.42,.18,.875);
  mataKedipKiri.renderOrder=120;
  mataKedipKanan.renderOrder=120;
  headGroup.add(mataKedipKiri, mataKedipKanan);
}

function hapusMataKedipSementara(){
  if(mataKedipKiri){headGroup.remove(mataKedipKiri);mataKedipKiri=null;}
  if(mataKedipKanan){headGroup.remove(mataKedipKanan);mataKedipKanan=null;}
}
/* =====================================================
   INFORBOT AI V11.1
   KELOPAK MATA TEPAT DI ATAS MATA ASLI
===================================================== */

function buatKelopakNaturalV11(){

  if(!headGroup){
    console.log("V11.1: headGroup belum siap");
    return;
  }

  if(mataLayerV10){
    headGroup.remove(mataLayerV10);
    mataLayerV10 = null;
  }

  mataLayerV10 = new THREE.Group();

  /*
     PENTING:
     Layer dibuat benar-benar di depan foto wajah.
  */
  mataLayerV10.position.set(
    0,
    0,
    0.90
  );

  headGroup.add(mataLayerV10);


  function buatKelopak(x){

    /*
       Bentuk kelopak:
       sedikit melengkung, bukan garis lurus.
    */

    const shape = new THREE.Shape();

    shape.moveTo(-0.16,0);

    shape.quadraticCurveTo(
      0,
      0.045,
      0.16,
      0
    );

    shape.quadraticCurveTo(
      0,
      -0.035,
      -0.16,
      0
    );

    const geo =
      new THREE.ShapeGeometry(shape);

    const mat =
      new THREE.MeshBasicMaterial({
        color:0x07111c,
        transparent:true,
        opacity:0,
        side:THREE.DoubleSide,
        depthTest:false,
        depthWrite:false
      });

    const kelopak =
      new THREE.Mesh(
        geo,
        mat
      );

    /*
       POSISI MATA
       Kita naikkan sedikit agar
       benar-benar mengenai mata wajah.
    */

    kelopak.position.set(
      x,
      0.27,
      0
    );

    if(x < 0){
      kelopak.rotation.z = 0.035;
    }
    else{
      kelopak.rotation.z = -0.035;
    }

    kelopak.renderOrder = 300;

    return kelopak;
  }


  const kiri =
    buatKelopak(-0.42);

  const kanan =
    buatKelopak(0.42);


  mataLayerV10.add(
    kiri,
    kanan
  );


  mataPejamV10 = [
    kiri,
    kanan
  ];


  console.log(
    "👁️ V11.1 KELOPAK MATA SIAP"
  );
}


/* =====================================================
   KEDIP NATURAL V11
===================================================== */

function kedipMataV10(){

  if(
    sedangBerkedipV10 ||
    !mataPejamV10
  ){
    return;
  }

  sedangBerkedipV10 = true;

  console.log(
    "👁️ V11 MATA MENUTUP"
  );

  /*
     Fase menutup
  */

  mataPejamV10.forEach(function(mata){

    mata.material.opacity = 0.95;

    mata.scale.y = 0.25;

  });


  /*
     Mata tertutup hanya sebentar.
  */

  setTimeout(function(){

    if(!mataPejamV10){
      return;
    }

    /*
       Buka kembali secara bertahap
    */

    mataPejamV10.forEach(function(mata){

      mata.material.opacity = 0.55;
      mata.scale.y = 0.65;

    });


    setTimeout(function(){

      if(!mataPejamV10){
        return;
      }

      mataPejamV10.forEach(function(mata){

        mata.material.opacity = 0;
        mata.scale.y = 1.15;

      });

      sedangBerkedipV10 = false;

      console.log(
        "👁️ V11 MATA TERBUKA"
      );

    },70);

  },110);
}


/* =====================================================
   JADWAL KEDIP V11
===================================================== */

function mulaiKedipanV10(){

  if(timerKedipV10){
    clearTimeout(timerKedipV10);
  }

  /*
     Kedipan setiap ±4–7 detik.
     Tidak terlalu sering.
  */

  const jeda =
    4000 +
    Math.random() * 3000;

  timerKedipV10 = setTimeout(
    function(){

      kedipMataV10();

      mulaiKedipanV10();

    },
    jeda
  );

  console.log(
    "👁️ V11 jadwal kedip:",
    Math.round(jeda),
    "ms"
  );
}
  
/* SATU-SATUNYA animate() */
function animate(){
  requestAnimationFrame(animate);
  waktuAnimasi+=.016;
  if(robot){
    robot.rotation.y=Math.sin(waktuAnimasi*.5)*.035;
    robot.position.y=-1.2+Math.sin(waktuAnimasi*1.2)*.025;
  }
  if(headGroup){
    headGroup.rotation.y=Math.sin(waktuAnimasi*.65)*.045;
    headGroup.rotation.x=Math.sin(waktuAnimasi*.45)*.018;
  }
  animasiMulut();
  renderer.render(scene,camera);
}

/* =====================================================
   RESIZE
===================================================== */
window.addEventListener(
  "resize",
  function(){
    if(!camera || !renderer) return;
    camera.aspect =
      window.innerWidth /
      window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);

/* =====================================================
   ROBOT BICARA
===================================================== */
function bicara(teks){
  teks = String(teks || "");
  if(!teks){
    return;
  }

  /* =================================================
     HENTIKAN SUARA SEBELUMNYA
  ================================================= */
  window.speechSynthesis.cancel();
  berhentiMulutBerbicara();

  /* =================================================
     BUAT SUARA
  ================================================= */
  const suara =
    new SpeechSynthesisUtterance(teks);
  suara.lang = "id-ID";
  suara.rate = 0.95;
  suara.pitch = 1;

  /* =================================================
     MULAI BERBICARA
  ================================================= */
  suara.onstart = function(){
    statusEl.innerText =
      "🔊 INFORBOT SEDANG BERBICARA";
    mulaiMulutBerbicara();
  };

  /* =================================================
     SELESAI BERBICARA
  ================================================= */
  suara.onend = function(){
    berhentiMulutBerbicara();
    statusEl.innerText =
      "SIAP MEMBANTU";
  };

  /* =================================================
     ERROR SUARA
  ================================================= */
  suara.onerror = function(){
    berhentiMulutBerbicara();
    statusEl.innerText =
      "SIAP MEMBANTU";
  };
  window.speechSynthesis.speak(suara);
}

/* =====================================================
   SAPA ROBOT
===================================================== */
helloBtn.addEventListener(
  "click",
  function(){
    const teks =
      "Halo! Saya INFORBOT AI. Saya siap membantu kamu belajar Informatika, kecerdasan buatan, dan teknologi.";
    pertanyaanEl.innerText =
      "Pertanyaan: Sapaan";
    jawabanEl.innerText = teks;
    bicara(teks);
  }
);

/* =====================================================
   KIRIM PERTANYAAN KE APPS SCRIPT
   MENGGUNAKAN JSONP
===================================================== */
function kirimPertanyaan(teks, selesai){
  const script =
    document.createElement("script");
  const callbackName =
    "inforbotCallback_" +
    Date.now() +
    "_" +
    Math.floor(Math.random()*10000);
  let sudahSelesai = false;
  
  function bersihkan(){
    if(sudahSelesai) return;
    sudahSelesai = true;
    if(window[callbackName]){
      delete window[callbackName];
    }
    if(script.parentNode){
      script.parentNode.removeChild(script);
    }
  }
  window[callbackName] =
    function(data){
      let jawaban =
        "Maaf, INFORBOT belum mendapatkan jawaban dari server.";
      if(
        data &&
        data.success &&
        data.jawaban
      ){
        jawaban =
          String(data.jawaban);
      }
      selesai(jawaban);
      bersihkan();
    };
  script.onerror =
    function(){
      selesai(
        "Koneksi ke otak INFORBOT belum berhasil. Periksa deployment Apps Script V3.0."
      );
      bersihkan();
    };
  const url =
    APPS_SCRIPT_URL +
    "?action=ask" +
    "&q=" +
    encodeURIComponent(teks) +
    "&callback=" +
    callbackName;
  script.src = url;
  document.body.appendChild(script);
}

/* =====================================================
   SPEECH RECOGNITION
===================================================== */
let recognition = null;
let sedangMendengar = false;
const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;
if(SpeechRecognition){
  recognition =
    new SpeechRecognition();
  recognition.lang = "id-ID";
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  recognition.onstart =
    function(){
      sedangMendengar = true;
      micBtn.innerText =
        "⏹ Berhenti";
      statusEl.innerText =
        "🎤 SAYA SEDANG MENDENGARKAN...";
    };
  recognition.onresult =
    function(event){
      const teks =
        event.results[0][0].transcript.trim();
      if(!teks) return;
      pertanyaanEl.innerText =
        "Pertanyaan: " + teks;
      jawabanEl.innerText =
        "⏳ INFORBOT sedang berpikir...";
      statusEl.innerText =
        "🧠 INFORBOT SEDANG BERPIKIR";
      kirimPertanyaan(
        teks,
        function(jawaban){
          jawabanEl.innerText =
            jawaban;
          bicara(jawaban);
        }
      );
    };
  recognition.onerror =
    function(event){
      console.log(
        "Speech error:",
        event.error
      );
      if(event.error === "not-allowed"){
        jawabanEl.innerText =
          "Izin mikrofon ditolak. Silakan izinkan mikrofon pada browser.";
      }
      else if(event.error === "no-speech"){

        jawabanEl.innerText =
          "Saya belum mendengar suara. Silakan coba lagi.";
      }
      else{
        jawabanEl.innerText =
          "Terjadi masalah pada mikrofon: " +
          event.error;
      }
      statusEl.innerText =
        "SIAP MEMBANTU";
    };
  recognition.onend =
    function(){
      sedangMendengar = false;
      micBtn.innerText =
        "🎤 Mulai Bicara";
      if(
        statusEl.innerText ===
        "🎤 SAYA SEDANG MENDENGARKAN..."
      ){
        statusEl.innerText =
          "SIAP MEMBANTU";
      }
    };
}
else{
  micBtn.disabled = true;
  statusEl.innerText =
    "Browser tidak mendukung Speech Recognition";
}

/* =====================================================
   TOMBOL MIKROFON
===================================================== */
micBtn.addEventListener(
  "click",
  function(){
    if(!recognition){
      alert(
        "Browser ini belum mendukung pengenalan suara."
      );
      return;
    }
    if(sedangMendengar){
      recognition.stop();
    }
    else{
      try{
        window.speechSynthesis.cancel();
        recognition.start();
      }
      catch(error){
        console.log(error);
      }
    }
  }
);

/* =====================================================
   MULAI
===================================================== */
initThree();
  
</script>
