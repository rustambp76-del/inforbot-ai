<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>INFORBOT AI</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#020817;
  color:white;
}

#app{
  width:100%;
  height:100%;
  position:relative;
  background:
    radial-gradient(circle at center,#063b68 0%,#020817 70%);
}

#title{
  position:absolute;
  top:18px;
  left:22px;
  z-index:20;
}

#title h1{
  margin:0;
  color:#66ddff;
  font-size:27px;
  text-shadow:0 0 15px #00aaff;
}

#title p{
  margin:4px 0;
  font-size:13px;
  color:#b9eaff;
}

#footer{
  position:absolute;
  top:18px;
  right:20px;
  z-index:30;

  padding:8px 14px;

  border:1px solid #00aaff;
  border-radius:20px;

  background:rgba(0,30,65,.8);

  color:#8bdfff;

  font-size:13px;
  font-weight:bold;

  box-shadow:0 0 15px rgba(0,170,255,.5);
}

#panel{
  position:absolute;
  right:25px;
  bottom:25px;

  width:340px;

  padding:18px;

  z-index:20;

  border:1px solid #009fff;
  border-radius:18px;

  background:rgba(2,18,38,.9);

  box-shadow:0 0 25px rgba(0,150,255,.35);
}

#status{
  color:#66ddff;
  font-weight:bold;
  margin-bottom:12px;
}

#question,
#answer{
  min-height:45px;
  font-size:14px;
  line-height:1.5;
  margin-bottom:10px;
}

#answer{
  color:#9de7ff;
}

button{
  width:100%;
  border:0;
  border-radius:30px;

  padding:13px;

  margin-top:8px;

  background:linear-gradient(
    90deg,
    #0077ff,
    #00cfff
  );

  color:white;

  font-size:14px;
  font-weight:bold;

  cursor:pointer;
}

button:hover{
  transform:scale(1.02);
}

button:active{
  transform:scale(.98);
}

#micButton.listening{
  background:linear-gradient(
    90deg,
    #ff1744,
    #ff5252
  );
}

#robotName{
  position:absolute;
  left:50%;
  bottom:30px;

  transform:translateX(-50%);

  color:#66ddff;

  font-weight:bold;

  text-shadow:0 0 12px #00aaff;
}

@media (max-width: 700px) {

  #title h1 {
    font-size: 21px;
  }

  #title p {
    font-size: 11px;
  }

  #footer {
    top: 75px;
    right: 15px;
    font-size: 11px;
  }

  #panel {
    left: 15px;
    right: 15px;
    bottom: 15px;
    width: auto;
  }

  #robotLabel {
    display: none;
  }
}
  #copyrightBottom{
  position:absolute;
  left:50%;
  bottom:8px;
  transform:translateX(-50%);
  z-index:20;

  color:#66ddff;
  font-size:12px;
  font-weight:bold;
  letter-spacing:1px;

  text-shadow:
    0 0 8px #00aaff;
}
  
</style>



<!-- THREE.JS VERSI STABIL -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const APPS_SCRIPT_URL =
"https://script.google.com/macros/s/AKfycbx-fdVRR04PL4rHHmYQZaQ1f-cMLFQV3IuB0sPFkhQojVqFkog_2bBlkavcw_FamS5q/exec";

</script>
  

</head>

<body>

<div id="app">

  <div id="title">
    <h1>🤖 INFORBOT AI</h1>
    <p>Asisten Virtual Informatika & Teknologi</p>
  </div>

  <div id="footer">
    © Rustam, SE
  </div>

  <div id="copyrightBottom">
  HAK CIPTA RUSTAM, S.E.
  </div>

  <div id="panel">

    <div id="status">
      🟢 SIAP
    </div>

    <div id="question">
      Tekan tombol mikrofon dan mulai berbicara.
    </div>

    <div id="answer">
      Halo! Saya INFORBOT AI. Saya siap membantu belajar Informatika, AI, dan teknologi.
    </div>

    <button id="micButton">
      🎤 MULAI BICARA
    </button>

    <button id="helloButton">
      🤖 SAPAAN ROBOT
    </button>

  </div>

</div>


<script>

/* =====================================================
   THREE.JS ROBOT
===================================================== */

var scene =
  new THREE.Scene();

var camera =
  new THREE.PerspectiveCamera(
    45,
    window.innerWidth/window.innerHeight,
    0.1,
    100
  );

camera.position.set(
  0,
  1.8,
  7
);


var renderer =
  new THREE.WebGLRenderer({
    antialias:true
  });

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
);

document
  .getElementById("app")
  .appendChild(renderer.domElement);


/* LIGHT */

var ambient =
  new THREE.AmbientLight(
    0x88bbff,
    1.8
  );

scene.add(ambient);


var light =
  new THREE.PointLight(
    0x00aaff,
    3,
    20
  );

light.position.set(
  2,
  5,
  5
);

scene.add(light);


/* ROBOT */

var robot =
  new THREE.Group();

robot.position.y=-1.2;

scene.add(robot);


/* MATERIAL */

var white =
  new THREE.MeshStandardMaterial({
    color:0xdceeff,
    metalness:.65,
    roughness:.25
  });

var dark =
  new THREE.MeshStandardMaterial({
    color:0x071321,
    metalness:.8,
    roughness:.2
  });

var blue =
  new THREE.MeshStandardMaterial({
    color:0x00cfff,
    emissive:0x0077aa,
    emissiveIntensity:3
  });


/* BODY */

var body =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2.2,
      2.2,
      1.25
    ),
    white
  );

body.position.y=1.2;

robot.add(body);


/* HEAD */

var head =
  new THREE.Group();

head.position.y=3;

robot.add(head);


var headBox =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      2.3,
      1.7,
      1.5
    ),
    white
  );

head.add(headBox);


/* FACE */

var face =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      1.85,
      .85,
      .12
    ),
    dark
  );

face.position.set(
  0,
  -.05,
  .78
);

head.add(face);


/* EYES */

var eyeGeometry =
  new THREE.SphereGeometry(
    .16,
    20,
    20
  );

var leftEye =
  new THREE.Mesh(
    eyeGeometry,
    blue
  );

leftEye.position.set(
  -.42,
  .05,
  .88
);

head.add(leftEye);


var rightEye =
  new THREE.Mesh(
    eyeGeometry,
    blue
  );

rightEye.position.set(
  .42,
  .05,
  .88
);

head.add(rightEye);


/* MOUTH */

var mouth =
  new THREE.Mesh(
    new THREE.BoxGeometry(
      .7,
      .12,
      .08
    ),
    blue
  );

mouth.position.set(
  0,
  -.37,
  .86
);

head.add(mouth);


/* CHEST LIGHT */

var chestLight =
  new THREE.Mesh(
    new THREE.SphereGeometry(
      .16,
      20,
      20
    ),
    blue
  );

chestLight.position.set(
  0,
  1.3,
  .67
);

robot.add(chestLight);


/* ARMS */

function makeArm(x){

  var arm =
    new THREE.Group();

  arm.position.set(
    x,
    1.3,
    0
  );

  var upper =
    new THREE.Mesh(
      new THREE.BoxGeometry(
        .5,
        1.7,
        .6
      ),
      white
    );

  upper.position.y=-.2;

  arm.add(upper);


  var hand =
    new THREE.Mesh(
      new THREE.SphereGeometry(
        .35,
        20,
        20
      ),
      white
    );

  hand.position.y=-1.15;

  arm.add(hand);

  robot.add(arm);

  return arm;
}

var leftArm =
  makeArm(-1.45);

var rightArm =
  makeArm(1.45);


/* =====================================================
   SUARA
===================================================== */

var status =
  document.getElementById("status");

var question =
  document.getElementById("question");

var answer =
  document.getElementById("answer");

var micButton =
  document.getElementById("micButton");

var helloButton =
  document.getElementById("helloButton");


var isSpeaking=false;


/* =====================================================
   TEXT TO SPEECH
===================================================== */

function bicara(teks){

  if(!window.speechSynthesis){

    alert(
      "Browser tidak mendukung suara."
    );

    return;
  }

  window.speechSynthesis.cancel();

  var suara =
    new SpeechSynthesisUtterance(teks);

  suara.lang="id-ID";

  suara.rate=.95;

  suara.pitch=1;

  suara.onstart=function(){

    isSpeaking=true;

    status.innerText=
      "🗣️ INFORBOT BERBICARA";

  };

  suara.onend=function(){

    isSpeaking=false;

    status.innerText=
      "🟢 SIAP";

  };

  window.speechSynthesis.speak(
    suara
  );
}


/* =====================================================
   SAPAAN
===================================================== */

helloButton.onclick=function(){

  var teks =
    "Halo! Saya INFORBOT AI. Saya siap membantu kamu belajar Informatika, kecerdasan buatan, dan perkembangan teknologi.";

  question.innerText=
    "👋 INFORBOT menyapa";

  answer.innerText=
    teks;

  bicara(teks);

};
/* =====================================================
   HUBUNGKAN KE OTAK INFORBOT - APPS SCRIPT
===================================================== */

function jawab(teks){

  return new Promise(function(resolve){

    var script =
      document.createElement("script");

    var callbackName =
      "inforbotCallback_" + Date.now();

    window[callbackName] =
      function(data){

        if(
          data &&
          data.success &&
          data.jawaban
        ){

          resolve(data.jawaban);

        }else{

          resolve(
            "Maaf, INFORBOT belum mendapatkan jawaban dari server."
          );

        }

        delete window[callbackName];

        if(script.parentNode){
          script.parentNode.removeChild(script);
        }

      };


    var url =
      APPS_SCRIPT_URL +
      "?action=ask" +
      "&q=" +
      encodeURIComponent(teks) +
      "&callback=" +
      callbackName;


    script.src=url;


    script.onerror=function(){

      resolve(
        "Koneksi ke otak INFORBOT belum berhasil. Periksa koneksi Apps Script."
      );

      delete window[callbackName];

      if(script.parentNode){
        script.parentNode.removeChild(script);
      }

    };


    document.body.appendChild(script);

  });

}

/* =====================================================
   SPEECH RECOGNITION
===================================================== */

var Recognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;

var recognition=null;

if(Recognition){

  recognition =
    new Recognition();

  recognition.lang=
    "id-ID";

  recognition.continuous=false;

  recognition.interimResults=false;

  recognition.maxAlternatives=1;


  recognition.onstart=function(){

    status.innerText=
      "🔴 MENDENGARKAN...";

    micButton.innerText=
      "🛑 BERHENTI";

    micButton.classList.add(
      "listening"
    );

  };


  recognition.onresult=function(event){

    var teks =
      event.results[0][0].transcript;

    question.innerText=
      "🗣️ "+teks;

    status.innerText=
      "🧠 MEMPROSES...";

    var jawaban=
      jawab(teks);

    answer.innerText=
      jawaban;

    bicara(jawaban);

  };


  recognition.onerror=function(event){

    console.log(
      "MIC ERROR:",
      event.error
    );

    micButton.classList.remove(
      "listening"
    );

    micButton.innerText=
      "🎤 MULAI BICARA";


    if(event.error==="not-allowed"){

      status.innerText=
        "⚠️ AKSES MIKROFON DITOLAK";

      answer.innerText=
        "Klik ikon gembok di sebelah alamat website lalu izinkan Mikrofon.";

    }

    else if(
      event.error==="no-speech"
    ){

      status.innerText=
        "🟡 TIDAK ADA SUARA";

      answer.innerText=
        "Saya belum mendengar suara. Silakan coba lagi.";

    }

    else{

      status.innerText=
        "⚠️ ERROR MIKROFON";

      answer.innerText=
        "Kesalahan mikrofon: "+
        event.error;

    }

  };


  recognition.onend=function(){

    micButton.classList.remove(
      "listening"
    );

    micButton.innerText=
      "🎤 MULAI BICARA";

    if(!isSpeaking){

      status.innerText=
        "🟢 SIAP";

    }

  };


  micButton.onclick=function(){

    try{

      if(
        micButton.classList.contains(
          "listening"
        )
      ){

        recognition.stop();

      }else{

        recognition.start();

      }

    }catch(error){

      console.log(error);

    }

  };

}else{

  status.innerText=
    "⚠️ FITUR SUARA TIDAK TERSEDIA";

  answer.innerText=
    "Gunakan Google Chrome untuk fitur suara.";

  micButton.disabled=true;

}


/* =====================================================
   JAWABAN SEMENTARA
===================================================== */

function jawab(teks) {

  return new Promise(function(resolve) {

    var script = document.createElement("script");

    var callbackName =
      "inforbotCallback_" +
      Date.now();

    window[callbackName] =
      function(data) {

        try {

          if (
            data &&
            data.success &&
            data.jawaban
          ) {

            resolve(data.jawaban);

          } else {

            resolve(
              "Maaf, saya belum mendapatkan jawaban dari server INFORBOT."
            );

          }

        } catch (error) {

          resolve(
            "Terjadi kesalahan saat memproses jawaban."
          );

        }

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      };


    var url =
      APPS_SCRIPT_URL +
      "?action=ask" +
      "&q=" +
      encodeURIComponent(teks) +
      "&callback=" +
      callbackName;


    script.src = url;

    script.onerror =
      function() {

        resolve(
          "Koneksi ke otak INFORBOT belum berhasil. Periksa deployment Apps Script."
        );

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      };


    document.body.appendChild(script);

  });

}


/* =====================================================
   ANIMASI
===================================================== */

var waktu=0;

function animasi(){

  requestAnimationFrame(
    animasi
  );

  waktu+=.01;


  robot.position.y=
    -1.2+
    Math.sin(waktu*2)*.04;


  head.rotation.y=
    Math.sin(waktu*.7)*.08;


  head.rotation.z=
    Math.sin(waktu*.5)*.025;


  leftArm.rotation.z=
    -.04+
    Math.sin(waktu)*.02;


  rightArm.rotation.z=
    .04+
    Math.sin(waktu)*.02;


  chestLight.scale.setScalar(
    1+
    Math.sin(waktu*4)*.15
  );


  if(isSpeaking){

    mouth.scale.y=
      1+
      Math.abs(
        Math.sin(waktu*18)
      )*3;

  }else{

    mouth.scale.y=1;

  }


  renderer.render(
    scene,
    camera
  );

}

animasi();


/* =====================================================
   RESIZE
===================================================== */

window.onresize=function(){

  camera.aspect=
    window.innerWidth/
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

};

</script>

</body>
</html>
