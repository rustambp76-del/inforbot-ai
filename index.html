<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>INFORBOT AI</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #020817;
  color: white;
}

#app {
  width: 100%;
  height: 100%;
  position: relative;
  background:
    radial-gradient(circle at center, #06335c 0%, #020817 65%);
}

canvas {
  display: block;
}

#title {
  position: absolute;
  top: 20px;
  left: 25px;
  z-index: 20;
}

#title h1 {
  margin: 0;
  font-size: 28px;
  color: #66ddff;
  text-shadow: 0 0 15px #00aaff;
}

#title p {
  margin: 5px 0;
  color: #b9eaff;
  font-size: 14px;
}

#footer {
  position: absolute;
  top: 18px;
  right: 25px;
  z-index: 30;

  color: #8bdfff;
  font-size: 13px;
  font-weight: bold;

  padding: 8px 14px;

  border: 1px solid rgba(0,170,255,0.6);
  border-radius: 20px;

  background: rgba(0,35,75,0.65);

  box-shadow:
    0 0 12px rgba(0,170,255,0.35);

  text-shadow:
    0 0 8px #00aaff;
}

#panel {
  position: absolute;
  right: 30px;
  bottom: 30px;

  width: 340px;

  padding: 20px;

  z-index: 20;

  background: rgba(2,20,40,0.88);

  border: 1px solid rgba(0,180,255,0.5);

  border-radius: 20px;

  box-shadow:
    0 0 25px rgba(0,150,255,0.25);
}

#status {
  color: #66ddff;
  font-weight: bold;
  margin-bottom: 12px;
}

#question {
  min-height: 55px;
  color: #ffffff;
  font-size: 15px;
  line-height: 1.5;
  margin-bottom: 12px;
}

#answer {
  min-height: 55px;
  color: #a9e8ff;
  font-size: 14px;
  line-height: 1.5;
  margin-bottom: 18px;
}

button {
  width: 100%;
  padding: 13px;

  border: none;
  border-radius: 30px;

  background: linear-gradient(
    90deg,
    #0077ff,
    #00cfff
  );

  color: white;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  box-shadow:
    0 0 15px rgba(0,180,255,0.4);

  margin-top: 8px;
}

button:hover {
  transform: scale(1.02);
}

button:active {
  transform: scale(0.98);
}

#micButton.listening {
  background: linear-gradient(
    90deg,
    #ff1744,
    #ff5252
  );

  box-shadow:
    0 0 25px rgba(255,40,70,0.7);
}

#robotLabel {
  position: absolute;

  left: 50%;
  bottom: 40px;

  transform: translateX(-50%);

  z-index: 10;

  color: #66ddff;

  font-size: 18px;
  font-weight: bold;

  text-shadow:
    0 0 12px #00aaff;
}

@media (max-width: 700px) {

  #title h1 {
    font-size: 21px;
  }

  #title p {
    font-size: 11px;
  }

  #footer {
    top: 75px;
    right: 15px;
    font-size: 11px;
  }

  #panel {
    left: 15px;
    right: 15px;
    bottom: 15px;
    width: auto;
  }

  #robotLabel {
    display: none;
  }
}
</style>

<!-- THREE.JS -->
<script type="importmap">
{
  "imports": {
    "three":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/":
      "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>

</head>

<body>

<div id="app">

  <div id="title">
    <h1>🤖 INFORBOT AI</h1>
    <p>Asisten Virtual Informatika & Teknologi</p>
  </div>

  <div id="footer">
    © Rustam, SE
  </div>

  <div id="robotLabel">
    INFORBOT
  </div>

  <div id="panel">

    <div id="status">
      🟢 SIAP
    </div>

    <div id="question">
      Tekan tombol mikrofon dan mulai berbicara.
    </div>

    <div id="answer">
      Halo! Saya INFORBOT AI.
      Saya siap membantu belajar Informatika,
      AI, dan teknologi.
    </div>

    <button id="micButton">
      🎤 MULAI BICARA
    </button>

    <button id="helloButton">
      🤖 SAPAAN ROBOT
    </button>

  </div>

</div>


<script type="module">

import * as THREE from "three";


/* =====================================================
   THREE.JS
===================================================== */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020817);


/* CAMERA */

const camera = new THREE.PerspectiveCamera(
  45,
  window.innerWidth / window.innerHeight,
  0.1,
  100
);

camera.position.set(0, 2.2, 7);


/* RENDERER */

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.outputColorSpace =
  THREE.SRGBColorSpace;

document
  .getElementById("app")
  .appendChild(renderer.domElement);


/* LIGHT */

const ambientLight =
  new THREE.AmbientLight(
    0x88bbff,
    2
  );

scene.add(ambientLight);


const mainLight =
  new THREE.PointLight(
    0x00aaff,
    80,
    20
  );

mainLight.position.set(
  2,
  5,
  5
);

scene.add(mainLight);


const light2 =
  new THREE.PointLight(
    0x4466ff,
    60,
    15
  );

light2.position.set(
  -4,
  2,
  2
);

scene.add(light2);


/* =====================================================
   ROBOT
===================================================== */

const robot = new THREE.Group();

scene.add(robot);

robot.position.y = -1.2;


/* MATERIAL */

const whiteMaterial =
  new THREE.MeshStandardMaterial({
    color: 0xdceeff,
    metalness: 0.65,
    roughness: 0.28
  });


const darkMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x071321,
    metalness: 0.8,
    roughness: 0.2
  });


const blueMaterial =
  new THREE.MeshStandardMaterial({
    color: 0x00bfff,
    emissive: 0x0066aa,
    emissiveIntensity: 3
  });


/* =====================================================
   BODY
===================================================== */

const bodyGeometry =
  new THREE.BoxGeometry(
    2.3,
    2.4,
    1.25
  );

const body =
  new THREE.Mesh(
    bodyGeometry,
    whiteMaterial
  );

body.position.y = 1.2;

robot.add(body);


/* CHEST */

const chestGeometry =
  new THREE.BoxGeometry(
    0.9,
    0.7,
    0.08
  );

const chest =
  new THREE.Mesh(
    chestGeometry,
    darkMaterial
  );

chest.position.set(
  0,
  1.35,
  0.67
);

robot.add(chest);
